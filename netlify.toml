[build]
  publish = "public"
  functions = "netlify/functions"
  command = "echo Build complete"

[build.environment]
  NODE_VERSION = "18"

# Redirect /api/* to the serverless Express function
# event.path keeps the original /api/... path so Express routes match correctly
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

# Fallback SPA route — must be last
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  node_bundler = "nft"
  included_files = [
    "models/**",
    "controllers/**",
    "routes/**",
    "middleware/**",
    "config/**",
    "app.js"
  ]
