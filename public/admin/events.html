<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Events | Golden Fork Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="/css/style.css" /><link rel="stylesheet" href="/css/admin.css" />
</head>
<body>
  <div class="admin-wrapper">
    <div id="admin-sidebar-placeholder"></div>
    <main class="admin-main">
      <div class="admin-topbar"><h1>Event Bookings</h1></div>
      <div class="admin-content">
        <div class="page-toolbar">
          <div class="toolbar-left">
            <select class="form-control" id="ev-status-filter" style="min-width:160px;">
              <option value="">All Statuses</option>
              <option>pending</option><option>reviewing</option><option>confirmed</option><option>cancelled</option>
            </select>
            <select class="form-control" id="ev-type-filter" style="min-width:160px;">
              <option value="">All Event Types</option>
              <option>Birthday</option><option>Wedding</option><option>Corporate</option>
              <option>Private Dining</option><option>Catering</option><option>Other</option>
            </select>
          </div>
        </div>
        <div class="admin-section">
          <div class="table-wrapper">
            <table>
              <thead><tr><th>Customer</th><th>Event Type</th><th>Date</th><th>Guests</th><th>Venue</th><th>Budget</th><th>Status</th><th>Actions</th></tr></thead>
              <tbody id="events-tbody"><tr><td colspan="8" style="text-align:center;padding:3rem;"><div class="spinner"></div></td></tr></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Detail Modal -->
  <div class="modal-overlay" id="ev-detail-modal" style="display:none;">
    <div class="modal" style="max-width:560px;">
      <div class="modal-header"><h3>Event Details</h3><button class="modal-close" onclick="document.getElementById('ev-detail-modal').style.display='none'"><i class="fas fa-times"></i></button></div>
      <div class="modal-body" id="ev-detail-body"></div>
      <div class="modal-footer"><button class="btn btn-outline" onclick="document.getElementById('ev-detail-modal').style.display='none'">Close</button></div>
    </div>
  </div>

  <div id="toast-container"></div>
  <script src="/js/api.js"></script>
  <script src="/js/admin/auth.js"></script>
  <script src="/js/admin/events.js"></script>
</body>
</html>
